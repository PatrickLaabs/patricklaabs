<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Blog</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.6; }
        header { text-align: center; margin-bottom: 2rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
        .post { margin-bottom: 2rem; border: 1px solid #eee; padding: 1rem; border-radius: 5px; }
        button { padding: 0.5rem 1rem; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>Patrick's Blog</h1>
        <p>Go Developer, Cloud-Native Enthusiast</p>
    </header>

    <main>
        <section class="post">
            <h2>Welcome to my personal blog</h2>
            <p>This blog is built using Go, HTMX, and Ko.</p>

            <div id="htmx-demo">
                <p>Click the button below to test HTMX integration:</p>
                <button hx-get="/clicked" hx-swap="outerHTML">Click Me</button>
            </div>
        </section>
    </main>
</body>
</html>
