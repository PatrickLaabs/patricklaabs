<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Blog</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .markdown-content h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 1rem; color: #111827; }
        .markdown-content h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #1f2937; }
        .markdown-content h3 { font-size: 1.5rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #374151; }
        .markdown-content p { margin-bottom: 1.25rem; color: #4b5563; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; color: #4b5563; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1.25rem; color: #4b5563; }
        .markdown-content a { color: #2563eb; text-decoration: underline; }
        .markdown-content a:hover { color: #1d4ed8; }
        .markdown-content pre { background-color: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.25rem; }
        .markdown-content code { font-family: monospace; background-color: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875em; }
        .markdown-content pre code { background-color: transparent; padding: 0; }
        .markdown-content blockquote { border-left-width: 4px; border-color: #e5e7eb; padding-left: 1rem; font-style: italic; color: #6b7280; margin-bottom: 1.25rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans leading-relaxed">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <header class="text-center mb-12 border-b border-gray-200 pb-8">
            <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight mb-2">Patrick's Blog</h1>
            <p class="text-xl text-gray-600 font-light">Go Developer, Cloud-Native Enthusiast</p>
        </header>

        <main>
            <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-8 transition hover:shadow-md">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Welcome to my personal blog</h2>
                <p class="text-gray-700 mb-6">This blog is built using Go, HTMX, and Ko.</p>

                <div id="htmx-demo" class="bg-blue-50 rounded-lg p-6 border border-blue-100">
                    <p class="text-blue-900 mb-4 font-medium">Click the button below to test HTMX integration:</p>
                    <button
                        hx-get="/clicked"
                        hx-swap="outerHTML"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md shadow-sm transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    >
                        Click Me
                    </button>
                </div>
            </section>

            {{if .Posts}}
            <div class="space-y-8">
                {{range .Posts}}
                <article class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 transition hover:shadow-md markdown-content">
                    {{.Content}}
                </article>
                {{end}}
            </div>
            {{end}}
        </main>

        <footer class="text-center mt-12 text-gray-500 text-sm">
            <p>&copy; 2026 Patrick Laabs</p>
        </footer>
    </div>
</body>
</html>
