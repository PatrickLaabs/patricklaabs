name: Blog Ko Build

on:
  push:
    branches:
      - main

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install ko
        uses: ko-build/setup-ko@v0.6
      - name: Build container
        run: |
          cd blog
          ko build --local .
