name: Build and Push with KO

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'blog/go.mod'

      - name: Check for known vulnerabilities
        working-directory: blog
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_SECRET }}

      - name: Build and Push Image
        working-directory: blog
        env:
          KO_DOCKER_REPO: ghcr.io/patricklaabs/patricklaabs
        run: |
          # If it's a pull request, just build locally
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            export KO_DOCKER_REPO=ko.local
            ko build . --bare
          else
            ko build . --bare --tags "latest,$GITHUB_REF_NAME"
          fi
